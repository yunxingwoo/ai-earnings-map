<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  /* 与站点 styles.css 同源色板:Claude DESIGN.md 深色适配 */
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:900px; height:1200px; overflow:hidden; }
  body {
    background:#141413; color:#faf9f5;
    font-family:"Microsoft YaHei","微软雅黑","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; position:relative;
  }
  .num { font-variant-numeric:tabular-nums; }
  .mono { font-family:ui-monospace,"SF Mono",Menlo,monospace; }
  .sub { color:#b0aea5; } .meta { color:#87867f; } .terra { color:#d97757; }

  /* 顶部品牌行 */
  .brand { display:flex; align-items:center; gap:15px; padding:46px 60px 0; }
  .spark { color:#d97757; font-size:26px; line-height:1; transform:translateY(-1px); }
  .brand .cn { font-size:21px; font-weight:700; letter-spacing:1.5px; }
  .brand .en { font-size:10.5px; letter-spacing:.26em; color:#87867f; margin-top:3px; }
  .brand .who { margin-left:auto; font-size:12px; color:#87867f; letter-spacing:.08em; }

  .rule { margin:28px 60px 0; position:relative; height:9px; border-top:1px solid #30302e; }
  .rule i { position:absolute; top:0; width:1px; height:5px; background:#30302e; }
  .rule i:first-child{left:0} .rule i:last-child{right:0}

  .hero { text-align:center; padding-top:44px; }
  .hero .tag { font-size:12.5px; letter-spacing:.36em; text-indent:.36em; color:#d97757; }
  .hero h1 { margin-top:18px; font-size:47px; font-weight:800; letter-spacing:4px; }
  .hero h1 .dot { color:#d97757; }
  .hero .sub { margin-top:16px; font-size:15.5px; letter-spacing:2px; color:#b0aea5; }
  .hero .sub b { color:#faf9f5; font-weight:700; }

  .gauge { display:flex; justify-content:center; margin-top:36px; }
  .gauge .cell { padding:0 36px; border-left:1px solid #2b2b28; }
  .gauge .cell:first-child { border-left:none; }
  .gauge .n { font-size:32px; font-weight:800; letter-spacing:1px; }
  .gauge .n em { font-style:normal; color:#d97757; }
  .gauge .l { margin-top:7px; font-size:11.5px; letter-spacing:.32em; text-indent:.32em; color:#87867f; }

  /* 二维码:象牙面板 + 深色模块 */
  .qrwrap { position:relative; width:496px; margin:42px auto 0; background:#faf9f5;
            border-radius:14px; padding:34px; box-shadow:0 8px 28px rgba(0,0,0,.42); }
  .qrwrap img { display:block; width:428px; height:428px; border-radius:6px; }
  .corner { position:absolute; width:26px; height:26px; border:2.5px solid #d97757; }
  .c1{top:-8px;left:-8px;border-right:none;border-bottom:none}
  .c2{top:-8px;right:-8px;border-left:none;border-bottom:none}
  .c3{bottom:-8px;left:-8px;border-right:none;border-top:none}
  .c4{bottom:-8px;right:-8px;border-left:none;border-top:none}
  .qrwrap .badge { position:absolute; top:16px; right:18px; font-size:10px;
                   letter-spacing:.2em; color:#87867f; font-family:ui-monospace,Menlo,monospace; }
  .scan { margin-top:20px; text-align:center; font-size:14.5px; letter-spacing:.5em;
          text-indent:.5em; color:#b0aea5; }
  .scan b { color:#faf9f5; font-weight:700; }

  .url { margin:22px auto 0; text-align:center; }
  .url span { display:inline-block; font-family:ui-monospace,"SF Mono",Menlo,monospace;
              font-size:15.5px; letter-spacing:.03em; color:#faf9f5;
              border:1px solid #30302e; border-radius:99px; padding:9px 28px; background:#1e1e1c; }
  .url span b { color:#d97757; font-weight:400; }

  .foot { position:absolute; left:60px; right:60px; bottom:40px; }
  .foot .line { border-top:1px solid #30302e; position:relative; height:8px; }
  .foot .line i { position:absolute; top:0; width:1px; height:5px; background:#30302e; }
  .foot .line i:first-child{left:0} .foot .line i:last-child{right:0}
  .foot .row { display:flex; justify-content:space-between; padding-top:13px;
               font-size:11.5px; letter-spacing:.12em; color:#87867f; }
</style>
</head>
<body>
  <div class="brand">
    <div class="spark">✳</div>
    <div>
      <div class="cn">AI 算力财报全景</div>
      <div class="en">EARNINGS INTELLIGENCE MAP</div>
    </div>
    <div class="who">by luckywoo</div>
  </div>
  <div class="rule"><i></i><i></i></div>

  <div class="hero">
    <div class="tag">扫码查看 · SCAN TO VIEW</div>
    <h1>从官方财报，计算产业景气<span class="dot">。</span></h1>
    <div class="sub">指标全部来自<b>官方披露原文</b> · 未披露不估算 · 同比环比实时计算</div>
    <div class="gauge">
      <div class="cell"><div class="n num">109</div><div class="l">公司</div></div>
      <div class="cell"><div class="n num">15</div><div class="l">产业链环节</div></div>
      <div class="cell"><div class="n num">642</div><div class="l">指标条目</div></div>
      <div class="cell"><div class="n num">571</div><div class="l">官方溯源</div></div>
    </div>
    <div class="qrwrap">
      <span class="corner c1"></span><span class="corner c2"></span>
      <span class="corner c3"></span><span class="corner c4"></span>
      <span class="badge">V.2026.09</span>
      <img src="qr.png" alt="QR">
    </div>
    <div class="scan">扫 码 查 看 <b>全 屏 交 互 地 图</b></div>
    <div class="url"><span>yunxingwoo.github.io<b>/</b>ai-earnings-map</span></div>
  </div>

  <div class="foot">
    <div class="line"><i></i><i></i></div>
    <div class="row">
      <span>数据版本 2026-09-22</span>
      <span>北京时区 UTC+8</span>
      <span>SEC · 巨潮资讯 · MOPS · 公司 IR</span>
    </div>
  </div>
</body>
</html>
